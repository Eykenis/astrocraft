<script type="application/json" id="deck-data">{"title":"Astrocraft","width":960.0,"height":540.0,"slides":[{"index":1,"title":"项目演示","text":"1 项目演示\n一款第一人称的洞穴探险游戏，地图使用程序化生成，核心交互采用物理机制，形成“探索—运输—撤离”的游戏循环.\n探索体素世界\n挖矿&搬运","image":"assets/slides/slide-01.webp","thumbnail":"assets/slides/thumb-01.webp","media":[{"id":1,"kind":"loop","source":"assets/media/demo-01.mp4","poster":"assets/media/demo-01-poster.webp","label":"1 项目演示 — 演示 1","x":62.490788,"y":204.16827,"width":392.8962,"height":221.00409,"rotation":0.0,"crop":{"l":0,"t":0,"r":0,"b":0},"flipH":false,"flipV":false},{"id":2,"kind":"loop","source":"assets/media/demo-02.mp4","poster":"assets/media/demo-02-poster.webp","label":"1 项目演示 — 演示 2","x":493.05017,"y":204.16818,"width":392.8963,"height":221.00417,"rotation":0.0,"crop":{"l":0,"t":0,"r":0,"b":0},"flipH":false,"flipV":false}]},{"index":2,"title":"设计思路解析","text":"2 设计思路解析\nPCG体现：无限体素场景生成（地形噪声+随机拼图结构）；实时生成怪物\n物理体现：以物理搬运为核心玩法，核心是围绕磁力牵引/绳索牵引的交互","image":"assets/slides/slide-02.webp","thumbnail":"assets/slides/thumb-02.webp","media":[{"id":3,"kind":"loop","source":"assets/media/demo-03.mp4","poster":"assets/media/demo-03-poster.webp","label":"2 设计思路解析 · PCG体现：无限体素场景生成（地形噪声+随机拼图结构）；实时生成怪物 — 演示 1","x":62.490788,"y":232.15637,"width":401.62238,"height":225.9126,"rotation":0.0,"crop":{"l":0,"t":0,"r":0,"b":0},"flipH":false,"flipV":false},{"id":4,"kind":"loop","source":"assets/media/demo-04.mp4","poster":"assets/media/demo-04-poster.webp","label":"2 设计思路解析 · PCG体现：无限体素场景生成（地形噪声+随机拼图结构）；实时生成怪物 — 演示 2","x":480.0,"y":232.15637,"width":401.62238,"height":225.9126,"rotation":0.0,"crop":{"l":0,"t":0,"r":0,"b":0},"flipH":false,"flipV":false}]},{"index":3,"title":"体素世界：区块与 Marching Cubes","text":"3 关键技术点设计及实现\n基于体素的 PCG 世界生成\n数据层：整个世界由体素网格表示，以大小为32x128x32的区块为单位独立生成与更新，并将区块进一步划分为 4 个 Section（每个大小32³)，将部分算法的执行边界进一步分解为以 Section 为单位.\n每个体素单元存储该处的元素类型和数值.\n表现层：\n通过 Marching Cubes 从数据层提取三角形等值面网格.\n区块(32x128x32)\n完整世界\nSection(32x32x32)","image":"assets/slides/slide-03.webp","thumbnail":"assets/slides/thumb-03.webp","media":[]},{"index":4,"title":"世界生成的四个阶段","text":"3 关键技术点设计及实现\n基于体素的 PCG 世界生成\n世界生成分为 4 个 PASS：自然地形生成->矿物生成->结构化地形生成->物件生成.\n所有内容只依赖种子+区块绝对坐标+配置信息生成，因此每个 PASS 内部可以按区块并行.","image":"assets/slides/slide-04.webp","thumbnail":"assets/slides/thumb-04.webp","media":[{"id":5,"kind":"loop","source":"assets/media/demo-05.mp4","poster":"assets/media/demo-05-poster.webp","label":"3 关键技术点设计及实现 · 基于体素的 PCG 世界生成 — 演示 1","x":228.96898,"y":181.19795,"width":502.06198,"height":282.40985,"rotation":0.0,"crop":{"l":0,"t":0,"r":0,"b":0},"flipH":false,"flipV":false}]},{"index":5,"title":"地形噪声","text":"3 关键技术点设计及实现\n基于体素的 PCG 世界生成\nPASS1：根据柏林噪声采样，生成洞穴基本地形\n空气","image":"assets/slides/slide-05.webp","thumbnail":"assets/slides/thumb-05.webp","media":[]},{"index":6,"title":"洞穴噪声组合","text":"3 关键技术点设计及实现\n基于体素的 PCG 世界生成\nPASS1：根据柏林噪声采样，生成洞穴基本地形\n四种柏林噪声：Spaghetti、Cheese、Noodle、Pillar\nCheese：大尺度低频噪声\nSpaghetti：算出两张噪声零值曲面的交线，再粗化形成通道\nNoodle：同Spaghetti，但更细，且更稀疏\nPillar：水平高频，垂直低频的噪声（表现为垂直柱状），将其回填至洞穴生成石柱","image":"assets/slides/slide-06.webp","thumbnail":"assets/slides/thumb-06.webp","media":[]},{"index":7,"title":"矿物生成","text":"3 关键技术点设计及实现\n基于体素的 PCG 世界生成\nPASS2：生成矿物","image":"assets/slides/slide-07.webp","thumbnail":"assets/slides/thumb-07.webp","media":[]},{"index":8,"title":"矿脉的随机生长","text":"3 关键技术点设计及实现\n基于体素的 PCG 世界生成\n矿物生成算法：拒绝采样+随机生长\n每个区块随机尝试若干次生成（可根据稀有度调节）\n每次尝试，随机选择一个非空气的体素位置\n成功选择的位置根据稀有度决定其被保留的概率，根据概率保留才继续生成\n从该位置随机向周围生长 N 次，形成矿脉\n（N由设定的矿脉平均大小采样决定）","image":"assets/slides/slide-08.webp","thumbnail":"assets/slides/thumb-08.webp","media":[]},{"index":9,"title":"结构生成","text":"3 关键技术点设计及实现\n基于体素的 PCG 世界生成\nPASS3：结构生成","image":"assets/slides/slide-09.webp","thumbnail":"assets/slides/thumb-09.webp","media":[]},{"index":10,"title":"结构模板编辑器","text":"3 关键技术点设计及实现\n基于体素的 PCG 世界生成\n结构模板：使用体素结构编辑器自定义体素房间\n允许在 EditMode 自定义房间模板，通过体素编辑以及出入口定义保存房间模板\nEditMode 编辑器\n实际生成效果","image":"assets/slides/slide-10.webp","thumbnail":"assets/slides/thumb-10.webp","media":[]},{"index":11,"title":"结构的连接规则","text":"3 关键技术点设计及实现\n基于体素的 PCG 世界生成\n结构生成：为每个房间结构定义其出入口位置、大小、开口方向（允许最多启用上下左右前后六个方向）\n出生点默认生成固定的房间结构；没有任何结构的区块有概率在区块内生成一个房间结构\n房间结构的出入口位置按概率决定是否继续连接\n生成时，用预定义的模板结构覆盖对应位置的体素\n结构生成任务会按房间所在的区块被切割并扔进相应队列，确保区块生成仍然可以相互独立\n已生成的房间\nx%概率连接\nx%概率连接\nx%概率连接\nx%概率连接","image":"assets/slides/slide-11.webp","thumbnail":"assets/slides/thumb-11.webp","media":[]},{"index":12,"title":"物件生成","text":"3 关键技术点设计及实现\n基于体素的 PCG 世界生成\nPASS4：物件生成\n沿用矿物生成的拒绝采样算法，\n采样条件：\n必须是空气体素\n下方必须是实体体素\n上方和水平方向必须有足够的空间","image":"assets/slides/slide-12.webp","thumbnail":"assets/slides/thumb-12.webp","media":[]},{"index":13,"title":"运行时怪物生成","text":"3 关键技术点设计及实现\n基于体素的 PCG 世界生成\n动态生成怪物：怪物非固定生成，而是动态生成.\n同样的拒绝采样逻辑. 每6秒以30%的概率生成一个怪物；\n仅在距离玩家在1个区块外的区域生成，最多尝试生成32次（位置合法才进入概率判断）；\n全局最多生成40个怪物；","image":"assets/slides/slide-13.webp","thumbnail":"assets/slides/thumb-13.webp","media":[]},{"index":14,"title":"基于体素的寻路","text":"3 关键技术点设计及实现\n基于体素的寻路\n所有怪物能在动态变化的体素世界中通过 A* 算法进行寻路. 每个怪物内部有一个clock以定时重新规划.\n先将世界坐标转换成体素节点位置，作为起点\n取玩家的世界坐标体素节点位置，作为终点\n实时查询所有体素节点是否可以被怪物碰撞箱占据，可以的标记为Walkable\nA*代价： —— 已产生的代价+估计代价（直线距离）\n每隔0.5秒查询当前物理位置是否符合预期，若不符合则尝试跳跃.","image":"assets/slides/slide-14.webp","thumbnail":"assets/slides/thumb-14.webp","media":[]},{"index":15,"title":"地形破坏与矿物刚体","text":"3 关键技术点设计及实现\n体素地形破坏、矿物刚体生成\n玩家出镐时，通过 Raycast 确定相交的表面，再将世界坐标转换为体素网格坐标，确定击中了哪个体素\n之后，在同类型体素间进行一次递减的BFS扩展：\n定义镐的冲击力为X，对击中体素造成X伤害.\n设体素耐久度为P，则体素剩余耐久为X-P.\n若X-P\u003c0,则破坏该体素，并将数值为(P-X)/2的力传播给该被破坏体素的邻居.","image":"assets/slides/slide-15.webp","thumbnail":"assets/slides/thumb-15.webp","media":[{"id":6,"kind":"loop","source":"assets/media/demo-06.mp4","poster":"assets/media/demo-06-poster.webp","label":"3 关键技术点设计及实现 · 体素地形破坏、矿物刚体生成 — 演示 1","x":465.076,"y":164.0204,"width":451.17245,"height":253.78448,"rotation":0.0,"crop":{"l":0,"t":0,"r":0,"b":0},"flipH":false,"flipV":false}]},{"index":16,"title":"矿脉提取演示","text":"3 关键技术点设计及实现\n体素地形破坏、矿物刚体生成\n破坏到矿物类型的体素时，直接BFS连通搜索所有相邻的矿物体素\n将整块矿物全部移除体素结构，并生成一个相同几何结构，可以搬运的矿物刚体","image":"assets/slides/slide-16.webp","thumbnail":"assets/slides/thumb-16.webp","media":[{"id":7,"kind":"loop","source":"assets/media/demo-07.mp4","poster":"assets/media/demo-07-poster.webp","label":"3 关键技术点设计及实现 · 体素地形破坏、矿物刚体生成 — 演示 1","x":70.69323,"y":202.37732,"width":452.6896,"height":254.63788,"rotation":0.0,"crop":{"l":0,"t":0,"r":0,"b":0},"flipH":false,"flipV":false}]},{"index":17,"title":"体素支撑连通性检测","text":"3 关键技术点设计及实现\n体素支撑连通性检测\n定义世界当前的支撑边界（水平：未生成的区块，垂直：世界顶端/底端基岩）\n玩家与体素场景产生交互时，提交一次支撑检测任务：\n从受影响的体素出发做标记式六邻域搜索，设空气体素为边界；若整个连通块都搜索完毕也没有找到支撑边界，说明整个连通块是未支撑的，触发脱离与独立体素块生成.\n独立体素块生成：\n从静态世界移除连通块\n构建独立Mesh\n计算质心并构建Collider","image":"assets/slides/slide-17.webp","thumbnail":"assets/slides/thumb-17.webp","media":[{"id":8,"kind":"loop","source":"assets/media/demo-08.mp4","poster":"assets/media/demo-08-poster.webp","label":"3 关键技术点设计及实现 · 体素支撑连通性检测 — 演示 1","x":506.01062,"y":289.91156,"width":375.30582,"height":211.10953,"rotation":0.0,"crop":{"l":0,"t":0,"r":0,"b":0},"flipH":false,"flipV":false}]},{"index":18,"title":"连通性检测优化","text":"3 关键技术点设计及实现\n体素支撑连通性检测——问题解决\n问题：纯BFS式的支撑连通块搜索复杂度过高？\n工程设计角度：根据玩家的实际对地形操作的能力以及场景估计，实际产生较大未支撑体素块的概率极低.\n算法角度：做A*引导式的填充搜索，（A*代价：已经过距离+距离最近的边界平面直线距离），引导优先向边界搜索，降低受支撑结构的搜索量.\n实际运行时未出现明显卡顿.","image":"assets/slides/slide-18.webp","thumbnail":"assets/slides/thumb-18.webp","media":[]},{"index":19,"title":"动态稀疏体素刚体交互","text":"3 关键技术点设计及实现\n动态稀疏体素刚体的交互\n独立的体素块无法像主体体素场景一样参与区块更新交互. 因此，为每个体素块创建一个模拟子区块.\n当主场景的玩家与该体素块产生交互时，先做坐标转换，再在子区块进行交互.\n世界坐标射线：\n转化起点为子区块坐标：","image":"assets/slides/slide-19.webp","thumbnail":"assets/slides/thumb-19.webp","media":[{"id":8,"kind":"loop","source":"assets/media/demo-08.mp4","poster":"assets/media/demo-08-poster.webp","label":"3 关键技术点设计及实现 · 动态稀疏体素刚体的交互 — 演示 1","x":420.22968,"y":231.33693,"width":461.08676,"height":259.36127,"rotation":0.0,"crop":{"l":0,"t":0,"r":0,"b":0},"flipH":false,"flipV":false}]},{"index":20,"title":"世界生成：优先级队列","text":"3 关键技术点设计及实现\nPCG世界生成——性能优化与问题解决\n解决方法：\n世界生成器负责管理一个优先队列，优先处理与表现强相关的区块\n优先级定义：分级优先.\n第2级：默认生成的地形，低优先级\n第1级：玩家交互导致更新的区块，高优先级\n问题：玩家破坏区块后，由于区块更新任务在队列中排队，导致交互反馈存在延迟","image":"assets/slides/slide-20.webp","thumbnail":"assets/slides/thumb-20.webp","media":[]},{"index":21,"title":"世界生成：缓冲区与 GC 优化","text":"3 关键技术点设计及实现\nPCG世界生成——性能优化与问题解决\n问题：更新区块任务提交后，现有区块被清除，但新区块还没有生成，存在短时间的交互失效，导致玩家在一瞬间内缺少支撑导致掉入虚空.\n解决方法：\n添加地形双缓冲，新区块准备完成前不销毁旧的区块\n由此衍生的 GC 卡顿问题：\n维护临时地形池（容量为 3 个区块），以 24MB 左右的持续内存占用解决频繁分配的 GC 卡顿问题.","image":"assets/slides/slide-21.webp","thumbnail":"assets/slides/thumb-21.webp","media":[]},{"index":22,"title":"寻路：分帧预算与演示","text":"3 关键技术点设计及实现\nPCG世界生成——性能优化与问题解决\n问题：怪物寻路计算量不稳定导致卡顿\n解决方法：\n所有怪物共用一个寻路资源分配器，分配器每帧给各个寻路 Agent 分配定量的寻路预算，用完即止，以实现分帧分摊开销\n效果：\n群体寻路不卡顿，且怪物无明显停顿.","image":"assets/slides/slide-22.webp","thumbnail":"assets/slides/thumb-22.webp","media":[{"id":9,"kind":"video","source":"assets/media/demo-09.mp4","poster":"assets/media/demo-09-poster.webp","label":"3 关键技术点设计及实现 · PCG世界生成——性能优化与问题解决 — 演示 1","x":459.144,"y":245.74583,"width":387.31024,"height":217.86197,"rotation":0.0,"crop":{"l":0,"t":0,"r":0,"b":0},"flipH":false,"flipV":false}]},{"index":23,"title":"弹簧阻尼式磁力牵引","text":"3 关键技术点设计及实现\n弹簧阻尼式的磁力牵引\n任意具有 Rigidbody 组件的对象都可以通过右键使用磁力进行牵引.\n目标持有点：相机正前方固定距离的位置.\n设目标持有点为 ，物体质心为，位置误差：\n玩家或持有点速度为 ，物体速度为 ，相对速度：\n总磁力：\n限制：1. 根据玩家当前能力限制最大磁力的数值.\n2. 根据40m/s²的加速度限制最大力以避免物体被甩飞.","image":"assets/slides/slide-23.webp","thumbnail":"assets/slides/thumb-23.webp","media":[{"id":10,"kind":"video","source":"assets/media/demo-10.mp4","poster":"assets/media/demo-10-poster.webp","label":"3 关键技术点设计及实现 · 弹簧阻尼式的磁力牵引 — 演示 1","x":511.22394,"y":283.13867,"width":395.4733,"height":222.45378,"rotation":0.0,"crop":{"l":0,"t":0,"r":0,"b":0},"flipH":false,"flipV":false}]},{"index":24,"title":"钩索式牵引","text":"3 关键技术点设计及实现\n钩索式牵引\n玩家可以扔出探险镐并通过右键牵引钉入地形的探险镐来模拟钩索效果.\n与磁力牵引不同，该方式触发的牵引为给玩家施加一个约束：\n钩索每帧强制玩家绕绳索的径向速度为0，确保玩家仅能在切向摆荡.","image":"assets/slides/slide-24.webp","thumbnail":"assets/slides/thumb-24.webp","media":[{"id":11,"kind":"video","source":"assets/media/demo-11.mp4","poster":"assets/media/demo-11-poster.webp","label":"3 关键技术点设计及实现 · 钩索式牵引 — 演示 1","x":224.36095,"y":226.50197,"width":500.6007,"height":281.58786,"rotation":0.0,"crop":{"l":0,"t":0,"r":0,"b":0},"flipH":false,"flipV":false}]},{"index":25,"title":"冲量反馈计算","text":"3 关键技术点设计及实现\n冲量反馈计算\n根据刚体受到的冲量大小计算价值损失.\n发生碰撞\n从PhysX得到碰撞冲量J\n计算单位冲量\n造成伤害=\n根据伤害百分比扣除价值/生命值\n结束\n超出阈值？\n其中， 是原始总价值， 是易碎度系数， 是最低受冲击阈值","image":"assets/slides/slide-25.webp","thumbnail":"assets/slides/thumb-25.webp","media":[]},{"index":26,"title":"破碎反馈的实现","text":"3 关键技术点设计及实现\n破碎反馈\n当有价值刚体的价值降低为0时，根据其当时所受冲量触发破碎和碎片飞溅效果.\n对于矿物：\n先确定碎片数\n再将矿物本身的三角形面片用 farthest-point sampling 分组\n为所有生成的碎片施加反向的冲量\n对于宝藏：\n其他流程一致，但碎片生成使用预先切好的碎片组，破碎时将原物体变为数个碎片组.","image":"assets/slides/slide-26.webp","thumbnail":"assets/slides/thumb-26.webp","media":[]},{"index":27,"title":"破碎反馈演示","text":"3 关键技术点设计及实现\n破碎反馈","image":"assets/slides/slide-27.webp","thumbnail":"assets/slides/thumb-27.webp","media":[{"id":12,"kind":"video","source":"assets/media/demo-12.mp4","poster":"assets/media/demo-12-poster.webp","label":"3 关键技术点设计及实现 · 破碎反馈 — 演示 1","x":76.198586,"y":117.2911,"width":395.70505,"height":222.58409,"rotation":0.0,"crop":{"l":0,"t":0,"r":0,"b":0},"flipH":false,"flipV":false},{"id":13,"kind":"video","source":"assets/media/demo-13.mp4","poster":"assets/media/demo-13-poster.webp","label":"3 关键技术点设计及实现 · 破碎反馈 — 演示 2","x":504.17953,"y":117.2911,"width":395.70505,"height":222.58409,"rotation":0.0,"crop":{"l":0,"t":0,"r":0,"b":0},"flipH":false,"flipV":false}]},{"index":28,"title":"AI 应用介绍","text":"4 AI应用介绍\n1. 早期使用AI快速出原型，验证想法，同时快速做算法调研\n2. 自己设计架构与游戏核心算法思路，写成详细文档交给AI实现\n3. 驱动AI对代码进行review与调优，给优化建议和算法采用建议\n4. 辅助完成资产方面的 dirty work（上材质、调动画等）","image":"assets/slides/slide-28.webp","thumbnail":"assets/slides/thumb-28.webp","media":[]},{"index":29,"title":"THANKS","text":"THANKS","image":"assets/slides/slide-29.webp","thumbnail":"assets/slides/thumb-29.webp","media":[]}]}</script>
